name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".gitattributes"

permissions:
  contents: write

concurrency:
  group: library-cleaner-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime explicitly
        run: node node_modules/electron/install.js
      - name: Run policy and project tests
        run: npm test
      - name: Build Windows desktop application
        run: npm run dist -- --publish never
      - name: Package portable application
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath 'docs/使用说明.md' -Destination 'release/win-unpacked/使用说明.md'
          New-Item -ItemType Directory -Path 'release-assets' -Force | Out-Null
          $archiveName = "LibraryCleaner-$version-win-x64.zip"
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath "release-assets/$archiveName" -CompressionLevel Optimal
          $hashValue = (Get-FileHash -LiteralPath "release-assets/$archiveName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hashValue  $archiveName" | Set-Content -LiteralPath 'release-assets/SHA256SUMS.txt' -Encoding ascii
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish downloadable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; no existing release files were replaced."
          }
          gh release create $tag "release-assets/LibraryCleaner-$env:RELEASE_VERSION-win-x64.zip" "release-assets/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "资料库管家 $env:RELEASE_VERSION · 简体中文桌面版" --notes-file "docs/发布说明-$env:RELEASE_VERSION.md"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
