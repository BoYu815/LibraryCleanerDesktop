<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self';connect-src 'none'"><title>生成文件管家</title><link rel="stylesheet" href="local-shell.css"></head><body>
<aside class="sidebar"><div class="brand"><img src="icon.png" alt=""><div><strong>生成文件管家</strong><span>找到文件，整理项目</span></div></div><div class="sidebar-label">我的项目<button id="add-project" title="关联项目文件夹" aria-label="关联项目文件夹">＋</button></div><nav id="projects" aria-label="项目列表"></nav><div class="sidebar-bottom"><button id="settings">连接设置</button><span>仅在本机管理文件</span></div></aside>
<main><header><div><p id="platform">本地文件</p><h1 id="project-title">全部项目</h1><div id="project-path">自动查找 GPT / Codex 与 DeepSeek 的项目目录</div></div><div class="header-controls"><div class="platform-switch" id="platform-switch" role="group" aria-label="切换 AI 平台" data-active="all"><span class="switch-marker" aria-hidden="true"></span><button data-platform="all" aria-pressed="true">全部</button><button data-platform="codex" aria-pressed="false">GPT</button><button data-platform="deepseek" aria-pressed="false">DeepSeek</button></div><button id="refresh">刷新定位</button></div></header><section class="tools"><input id="search" type="search" placeholder="搜索文件名或路径" aria-label="搜索文件名或路径"><select id="type" aria-label="文件类型"><option value="all">全部类型</option><option>演示文稿</option><option>文档</option><option>表格</option><option>图片</option><option>软件与压缩包</option><option>三维与图纸</option><option>音视频</option><option>其他</option></select><select id="sort" aria-label="排列顺序"><option value="date">最近修改</option><option value="name">名称排序</option><option value="size">文件大小</option></select></section>
<div class="summary"><span id="count">正在查找项目…</span><div id="selection" hidden><span id="selected-count"></span><button id="clear-selection">取消选择</button><button id="trash" class="danger">移到回收站</button></div></div>
<section class="file-panel"><div class="table-header"><input id="select-page" type="checkbox" aria-label="选择本页文件"><span>文件名称 / 所属项目</span><span>类型</span><span>大小</span><span>修改时间</span><span>操作</span></div><div id="file-list"></div><div id="empty" hidden><div class="empty-icon">▱</div><h2>这里还没有文件</h2><p id="empty-copy">可以关联项目文件夹，或检查软件的数据目录。</p><button id="empty-add">关联文件夹</button></div></section><footer><span id="status" role="status">正在自动定位本机项目…</span><div><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></footer></main>
<dialog id="settings-dialog"><form method="dialog"><div class="dialog-heading"><h2>连接设置</h2><button aria-label="关闭">×</button></div><p>按当前电脑的用户目录自动定位。特殊保存位置可以在这里选择。</p><div class="setting"><span>GPT / Codex 数据</span><code id="codex-home"></code><button type="button" data-setting="codexHome">选择目录</button></div><div class="setting"><span>DeepSeek 数据</span><code id="deepseek-home"></code><button type="button" data-setting="deepseekHome">选择目录</button></div><p class="muted">会话输出目录会单独识别。项目目录里的其他文件也会列出；这不代表每个文件都由 AI 创建。下载目录中的文件单独标为待归类。</p><button type="button" id="reset-settings">恢复自动定位</button></form></dialog><dialog id="warning-dialog"><h2>扫描提示</h2><pre id="warnings"></pre><form method="dialog"><button>知道了</button></form></dialog><script src="local-shell.js"></script></body></html>
